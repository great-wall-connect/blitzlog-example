[package]
name = "taskforge"
version = "0.1.0"
edition = "2021"
description = "A small task-tracker service that demonstrates the Blitzlog autonomous coding pipeline."
license = "MIT"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }