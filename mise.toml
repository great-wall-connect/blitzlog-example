[tools]
rust = "1.96"

[tasks."test"]
description = "Run cargo tests"
run = "cargo test"

[tasks."lint"]
description = "Run cargo fmt --check and clippy with -D warnings"
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"

[tasks."build"]
description = "Build the taskforge binary"
run = "cargo build --release"

[tasks.bootstrap]
description = "Install system and Rust build dependencies (Ubuntu)"
run = """
apt-get update && apt-get install -y --no-install-recommends \
    gcc g++ make pkg-config libssl-dev ca-certificates
"""
