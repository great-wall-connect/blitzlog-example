[tools]
rust = "1.96"
node = "20"
python = "3.12"

[tasks."test"]
description = "Run cargo tests"
run = "cargo test"

[tasks."lint"]
description = "Run cargo fmt --check and clippy with -D warnings"
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"

[tasks."build"]
description = "Build the taskforge binary"
run = "cargo build --release"

[tasks.bootstrap]
description = "Install system and Rust build dependencies"
run = "sudo dnf install -y gcc gcc-c++ make pkg-config openssl-devel && rustup component add rustfmt clippy && cargo fetch"
