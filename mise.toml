[tools]
rust = "1.96"
node = "20"
python = "3.12"

[tasks."test"]
description = "Run cargo tests"
run = "cargo test"

[tasks."lint"]
description = "Run cargo fmt --check and clippy with -D warnings"
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"

[tasks."build"]
description = "Build the taskforge binary"
run = "cargo build --release"

[tasks.bootstrap]
description = "Install Rust toolchain components and pre-fetch deps"
run = "rustup component add rustfmt clippy && cargo fetch"